server {
    listen 8080;
    root /usr/share/nginx/html;

    # Built files have a hash in their name, so they can be kept for a year. index.html must never be kept,
    # or people would keep seeing an old version of the site.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Every other address is a page inside the single-page app, so unknown paths get index.html.
    location / {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri /index.html;
    }
}
