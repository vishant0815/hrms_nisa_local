# Routing for an nginx ingress controller. The longer path wins, so /api/clock/ goes to the clock service and
# the rest of /api/ to Django. TLS needs a certificate secret (for example from cert-manager).
# The website itself is not here yet: when the frontend exists, add a "/" path pointing at its service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hrms
  namespace: hrms
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "6m"      # uploads are capped at 5 MB
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["hr.example.com"]                              # CHANGE
      secretName: hrms-tls
  rules:
    - host: hr.example.com                                   # CHANGE
      http:
        paths:
          - path: /api/clock/
            pathType: Prefix
            backend:
              service: {name: attendance-api, port: {number: 8001}}
          - path: /api/
            pathType: Prefix
            backend:
              service: {name: backend, port: {number: 8000}}
