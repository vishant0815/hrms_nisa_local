# Email: the relay puts queued emails on Kafka, the consumer sends them (and attaches payslip PDFs).
# Run exactly one of each: the relay is safe to repeat, but one is plenty for this size.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-relay
  namespace: hrms
spec:
  replicas: 1
  selector:
    matchLabels: {app: notification-relay}
  template:
    metadata:
      labels: {app: notification-relay}
    spec:
      containers:
        - name: notification-relay
          image: hrms-backend:latest
          command: ["python","manage.py","relay_notifications"]
          envFrom:
            - configMapRef: {name: hrms-config}
            - secretRef: {name: hrms-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-consumer
  namespace: hrms
spec:
  replicas: 1
  selector:
    matchLabels: {app: notification-consumer}
  template:
    metadata:
      labels: {app: notification-consumer}
    spec:
      securityContext: {fsGroup: 10001}   # so the non-root user can read the shared volume
      containers:
        - name: notification-consumer
          image: hrms-backend:latest
          command: ["python","manage.py","consume_notifications"]
          envFrom:
            - configMapRef: {name: hrms-config}
            - secretRef: {name: hrms-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: private-media, mountPath: /data/private_media}
      volumes:
        - name: private-media
          persistentVolumeClaim: {claimName: private-media}
