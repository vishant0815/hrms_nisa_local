# Settings that are not secret. Secrets are in secret.example.yaml (copy, fill in, and apply it yourself).
apiVersion: v1
kind: ConfigMap
metadata:
  name: hrms-config
  namespace: hrms
data:
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: "hr.example.com"          # CHANGE: your real domain(s), comma separated
  CORS_ALLOWED_ORIGINS: "https://hr.example.com"  # CHANGE
  SITE_URL: "https://hr.example.com"              # CHANGE: used for links in emails
  DB_ENGINE: "postgres"
  POSTGRES_DB: "hrms"
  POSTGRES_USER: "hrms"
  POSTGRES_HOST: "postgres"                        # CHANGE: your PostgreSQL service or managed host name
  POSTGRES_PORT: "5432"
  REDIS_URL: "redis://redis:6379/0"                # CHANGE if Redis is elsewhere
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"            # CHANGE if Kafka is elsewhere
  NOTIFICATIONS_BUS: "kafka"
  PRIVATE_MEDIA_ROOT: "/data/private_media"
  UPLOAD_SCANNING: "clamd"
  CLAMAV_HOST: "clamav"
  CLAMAV_PORT: "3310"
  EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
  EMAIL_HOST: "smtp.example.com"                   # CHANGE
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "true"
  DEFAULT_FROM_EMAIL: "HRMS <no-reply@example.com>"  # CHANGE
  PAYROLL_PENSION_TAX_METHOD: "net_pay"
  PAYROLL_BANK_HOLIDAY_MULTIPLIER: "1"
