# EXAMPLE ONLY. Copy to secret.yaml (which is git-ignored), put real values in, and `kubectl apply -f secret.yaml`.
# Better still, create it from your secret manager. Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: hrms-secrets
  namespace: hrms
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "CHANGE-ME-long-random-string"
  POSTGRES_PASSWORD: "CHANGE-ME"
  # Fernet key that encrypts bank details and dates of birth. Losing it makes them unreadable: back it up.
  # Generate: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  PAYROLL_ENCRYPTION_KEY: "CHANGE-ME"
  EMAIL_HOST_USER: "CHANGE-ME"
  EMAIL_HOST_PASSWORD: "CHANGE-ME"
