# Throw-away PostgreSQL, Kafka and a mail catcher so the whole system can be tried in a local test cluster.
# NOT for production: single copies, no backups, no passwords worth the name. Use managed services there.
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: hrms}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: hrms}
            - {name: POSTGRES_USER, value: hrms}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: hrms-secrets, key: POSTGRES_PASSWORD}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "hrms", "-d", "hrms"]}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: hrms}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: kafka, namespace: hrms}
spec:
  serviceName: kafka
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      enableServiceLinks: false   # otherwise Kubernetes injects KAFKA_PORT, which confuses the image
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
          ports: [{containerPort: 9092}]
          readinessProbe:
            tcpSocket: {port: 9092}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: kafka, namespace: hrms}
spec:
  selector: {app: kafka}
  ports: [{name: kafka, port: 9092}]
---
# Catches every email so it can be read at http://mailhog:8025 (port-forward it).
apiVersion: apps/v1
kind: Deployment
metadata: {name: mailhog, namespace: hrms}
spec:
  replicas: 1
  selector: {matchLabels: {app: mailhog}}
  template:
    metadata: {labels: {app: mailhog}}
    spec:
      containers:
        - name: mailhog
          image: mailhog/mailhog:latest
          ports: [{containerPort: 1025}, {containerPort: 8025}]
---
apiVersion: v1
kind: Service
metadata: {name: mailhog, namespace: hrms}
spec:
  selector: {app: mailhog}
  ports:
    - {name: smtp, port: 1025}
    - {name: web, port: 8025}
